name: CICD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: 277707114689.dkr.ecr.ap-northeast-2.amazonaws.com
      IMAGE_NAME: tama-api/order
      CLUSTER_NAME: tama-api-cluster
      IMAGE_FULL: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      DEPLOYMENT_NAME: order-service
      CONTAINER_NAME: order
      K8S_NAMESPACE: default

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create application.yml from secrets
        run: |
          mkdir -p src/main/resources
          printf '%s' "${{ secrets.APPLICATION }}" > src/main/resources/application.yml

      - name: Create gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.GRADLE_PROPERTIES }}" > ~/.gradle/gradle.properties

      - name: Enable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --secret id=gradle_properties,src=$HOME/.gradle/gradle.properties \
            -t $IMAGE_NAME .

      - name: Tag SHA image
        run: |
          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Tag latest image
        run: |
          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$IMAGE_NAME:latest

      - name: Push SHA image
        run: |
          docker push \
          $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
          $ECR_REGISTRY/$IMAGE_NAME:latest
          
      - name: Configure kubectl (use aws eks update-kubeconfig)
        # EKS라면 aws eks update-kubeconfig로 kubeconfig를 생성/갱신하는 것을 권장합니다.
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
        # 위 명령은 aws-actions/configure-aws-credentials에서 설정한 자격증명을 사용합니다.

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set image on Deployment and rollout
        id: deploy
        run: |
          echo "Updating deployment ${DEPLOYMENT_NAME} in namespace ${K8S_NAMESPACE} to image ${IMAGE_FULL}"
          kubectl -n ${K8S_NAMESPACE} set image deployment/${DEPLOYMENT_NAME} ${CONTAINER_NAME}=${IMAGE_FULL} --record
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=600s