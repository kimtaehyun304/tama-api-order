name: CICD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: 123456789.dkr.ecr.ap-northeast-2.amazonaws.com
      IMAGE_NAME: tama-api-order

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.GRADLE_PROPERTIES }}" > ~/.gradle/gradle.properties

      - name: Enable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --secret id=gradle_properties,src=$HOME/.gradle/gradle.properties \
            -t $IMAGE_NAME .

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
          $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}